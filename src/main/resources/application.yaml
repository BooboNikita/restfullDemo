# 应用配置
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 1MB
      max-file-size: 10MB
      max-request-size: 10MB
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # Redis 配置
  cache:
    type: redis
    redis:
      time-to-live: 36000000
      cache-null-values: true
      key-prefix: "cache:"
      use-key-prefix: true
  
  # ActiveMQ 配置
  activemq:
    embedded:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis 配置
mybatis:
  # 指定 mapper.xml 文件位置，如果没有可以不配置
#  mapper-locations: classpath:mybatis/*.xml
#  configuration:
#    map-underscore-to-camel-case: true  # 开启驼峰命名转换
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 到控制台

  freemarker:
    cache: false
    suffix: .ftl
    template-loader-path: classpath:/templates/
    charset: UTF-8
    check-template-location: true
    content-type: text/html
  devtools:
    restart:
      enabled: true
      exclude: static/**,templates/**
    livereload:
      enabled: true
  config-location: classpath:mybatis-config.xml

demo:
  secret: ${random.value}
  number: ${random.int}
  name: www.shujuwajue.com
  desc: ${demo.name} is a domain name

logging:
  config: classpath:logback-demo.xml

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/demodb?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1ms
          min-idle: 0
      timeout: 5000ms
    mongodb:
      uri: mongodb://localhost/test
      port: 27017
      database: test
      host: localhost
      auto-index-creation: true
      username: root
      password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456



server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

logging:
  config: classpath:log4j2-dev.xml
---
spring:
  config:
    activate:
      on-profile: prod
server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: test
server:
  port: 8081